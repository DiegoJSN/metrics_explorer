name: Demo checks

on:
  push:
    branches: [demo]
  pull_request:
    branches: [demo]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DEMO_MODE: "true"
      ENV: development
      DEBUG: "false"
      SECRET_KEY: ci-demo-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-demo.txt
      - run: python -m pip install -r requirements-demo.txt
      - run: python manage.py migrate --noinput
      - run: python manage.py test profiles.tests.test_demo_mode -v 2
      - run: python manage.py check
